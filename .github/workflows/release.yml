name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            bin: bin/courseforge
            target: courseforge-linux-amd64
          - os: windows-latest
            name: windows-amd64
            bin: bin/courseforge.exe
            target: courseforge-windows-amd64.exe
          - os: macos-latest
            name: macos-amd64
            bin: bin/courseforge
            target: courseforge-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tray icon (getlantern/systray) needs cgo + GTK/appindicator headers on Linux
      - name: Install Linux tray deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          fi

          for attempt in 1 2 3; do
            if gh release upload "${GITHUB_REF_NAME}" "${{ matrix.target }}" --clobber; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to upload release asset after ${attempt} attempts."
              exit 1
            fi

            echo "Upload attempt ${attempt} failed, retrying in 10 seconds..."
            sleep 10
          done

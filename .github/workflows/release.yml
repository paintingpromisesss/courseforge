name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: # manual run from any branch (gh workflow run release.yml --ref <branch>); publish step still only fires on a tag ref

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            bin: bin/courseforge
            target: courseforge-linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            bin: bin/courseforge
            target: courseforge-linux-arm64
          - os: windows-latest
            name: windows-amd64
            bin: bin/courseforge.exe
            target: courseforge-windows-amd64.exe
          - os: windows-latest
            name: windows-arm64
            bin: bin/courseforge.exe
            target: courseforge-windows-arm64.exe
            goarch: arm64
          - os: macos-15-intel
            name: macos-amd64
            bin: bin/courseforge
            target: courseforge-macos-amd64
          - os: macos-latest
            name: macos-arm64
            bin: bin/courseforge
            target: courseforge-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` finds tags for the version string

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tray icon (getlantern/systray) needs cgo + GTK/appindicator headers on Linux
      - name: Install Linux tray deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CGO_ENABLED: ${{ matrix.goarch == 'arm64' && '0' || '' }}
        run: ./scripts/build.ps1 ${{ matrix.goarch == 'arm64' && '-GoArch arm64' || '' }}

      - name: Build (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          # Create release if it doesn't exist yet (generates release notes exactly once)
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "Creating release ${tag}..."
            gh release create "${tag}" --generate-notes
          fi

          # Upload assets with retries
          echo "Uploading release assets..."
          for file in dist/*; do
            echo "Uploading ${file}..."
            for attempt in 1 2 3; do
              if gh release upload "${tag}" "${file}" --clobber; then
                echo "Successfully uploaded ${file}"
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to upload ${file} after ${attempt} attempts."
                exit 1
              fi

              echo "Upload attempt ${attempt} for ${file} failed, retrying in 10s..."
              sleep 10
            done
          done

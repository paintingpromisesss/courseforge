name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            bin: bin/courseforge
            target: courseforge-linux-amd64
          - os: windows-latest
            name: windows-amd64
            bin: bin/courseforge.exe
            target: courseforge-windows-amd64.exe
          - os: macos-latest
            name: macos-amd64
            bin: bin/courseforge
            target: courseforge-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tray icon (getlantern/systray) needs cgo + GTK/appindicator headers on Linux
      - name: Install Linux tray deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.target }}
          generate_release_notes: true


name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Run backend tests
        run: |
          cd backend
          go test ./internal/...

      - name: Build binary (linux)
        run: ./scripts/build.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            bin: bin/courseforge
            target: courseforge-linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            bin: bin/courseforge
            target: courseforge-linux-arm64
          - os: windows-latest
            name: windows-amd64
            bin: bin/courseforge.exe
            target: courseforge-windows-amd64.exe
          - os: windows-latest
            name: windows-arm64
            bin: bin/courseforge.exe
            target: courseforge-windows-arm64.exe
            goarch: arm64
          - os: macos-15-intel
            name: macos-amd64
            bin: bin/courseforge
            target: courseforge-macos-amd64
          - os: macos-latest
            name: macos-arm64
            bin: bin/courseforge
            target: courseforge-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` finds tags for the version string

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1 ${{ matrix.goarch == 'arm64' && '-GoArch arm64' || '' }}

      - name: Build (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        shell: bash
        run: |
          echo "Generating SHA256 checksums..."
          (cd dist && sha256sum courseforge-* > checksums.txt)
          cat dist/checksums.txt

      - name: Generate Release Notes
        shell: bash
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Generating release notes for ${tag}..."
          go run ./scripts/release-notes.go "${tag}" > dist/release_notes.md || true
          cat dist/release_notes.md

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          # Create release if it doesn't exist yet
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "Creating release ${tag}..."
            if [ -s dist/release_notes.md ]; then
              gh release create "${tag}" --notes-file dist/release_notes.md
            else
              gh release create "${tag}" --generate-notes
            fi
          fi

          # Upload assets with retries (includes binaries and checksums.txt)
          echo "Uploading release assets..."
          for file in dist/*; do
            echo "Uploading ${file}..."
            for attempt in 1 2 3; do
              if gh release upload "${tag}" "${file}" --clobber; then
                echo "Successfully uploaded ${file}"
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to upload ${file} after ${attempt} attempts."
                exit 1
              fi

              echo "Upload attempt ${attempt} for ${file} failed, retrying in 10s..."
              sleep 10
            done
          done
